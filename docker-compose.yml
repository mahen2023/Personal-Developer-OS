name: devos

x-api-base: &api-base
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-devos}:${POSTGRES_PASSWORD:-devos}@postgres:5432/${POSTGRES_DB:-devos}?schema=public
    REDIS_URL: redis://redis:6379
    STORAGE_LOCAL_PATH: /app/storage
  volumes:
    - storage:/app/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    # pgvector image now so Phase 6 (RAG) needs no migration of the container
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devos}
      POSTGRES_DB: ${POSTGRES_DB:-devos}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-devos} -d ${POSTGRES_DB:-devos}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *api-base
    command: ['node', 'dist/main.js']
    ports: ['${API_PORT:-4000}:4000']

  worker:
    <<: *api-base
    command: ['node', 'dist/worker.js']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports: ['${WEB_PORT:-3000}:3000']
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
