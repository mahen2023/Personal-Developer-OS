name: devos

x-api-base: &api-base
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-devos}:${POSTGRES_PASSWORD:-devos}@postgres:5432/${POSTGRES_DB:-devos}?schema=public
    REDIS_URL: redis://redis:6379
    STORAGE_LOCAL_PATH: /app/storage
    # Pinned, because `.env` is this container's env_file and the API reads
    # API_PORT to choose what to listen on. That variable is the port
    # `npm run dev` takes on the host; letting it through here would move the
    # listener out from under the published mapping below.
    API_PORT: 4000
    # Inside a container `localhost` is the container. The developer's Ollama
    # is on the host, so the default points at the host gateway; override
    # OLLAMA_BASE_URL in .env for an Ollama on another machine entirely.
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  volumes:
    - storage:/app/storage
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    # pgvector image now so Phase 6 (RAG) needs no migration of the container
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devos}
      POSTGRES_DB: ${POSTGRES_DB:-devos}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-devos} -d ${POSTGRES_DB:-devos}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    <<: *api-base
    command: ['node', 'dist/main.js']
    # Linux has no host.docker.internal by default; this makes the name resolve
    # there too, so one compose file works on all three platforms.
    extra_hosts: ['host.docker.internal:host-gateway']
    # 4002 and 3002, not 4000 and 3000: the stack is meant to run beside
    # `npm run dev`, and two things cannot hold the same port.
    ports: ['4002:4000']

  worker:
    <<: *api-base
    command: ['node', 'dist/worker.js']
    extra_hosts: ['host.docker.internal:host-gateway']

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:4000
    ports: ['3002:3000']
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  storage:
